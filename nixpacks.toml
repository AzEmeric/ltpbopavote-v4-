[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.fileinfo", "php84Extensions.tokenizer", "php84Extensions.bcmath", "php84Extensions.ctype", "php84Extensions.openssl"]

[phases.install]
cmds = [
    "npm ci || npm install",
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
    "npm run production"
]

[start]
cmd = "php artisan migrate --force && php -S 0.0.0.0:${PORT:-8080} -t public server.php"

[variables]
NODE_VERSION = "18"
PHP_VERSION = "8.4"
